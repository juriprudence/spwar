<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Simple FPS Game</title>
    <style>
        :root {
            --primary: #00ff00;
            --accent: #ffff00;
            --danger: #ff3333;
            --bg-overlay: rgba(0, 0, 0, 0.85);
            --bg-ui: rgba(0, 0, 0, 0.6);
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: var(--font-main);
            background-color: #000;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            height: 100vh;
            touch-action: none;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Mobile Controls */
        .joystick-container {
            position: absolute;
            bottom: 30px;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            z-index: 1000;
            touch-action: none;
        }

        #joystick {
            left: 40px;
        }

        #turnJoystick {
            right: 150px;
        }

        .joystick-knob {
            position: absolute;
            top: 25px;
            left: 25px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            pointer-events: none;
        }

        #shootButton {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 75px;
            height: 75px;
            background: var(--danger);
            color: #fff;
            border: 3px solid #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
            cursor: pointer;
            touch-action: none;
        }

        #shootButton:active {
            background: #fff;
            color: var(--danger);
            transform: scale(0.95);
        }

        #weaponChangeButton {
            position: absolute;
            bottom: 130px;
            right: 40px;
            width: 50px;
            height: 50px;
            background: #222;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 8px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        /* Top HUD Elements */
        #healthBar {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 220px;
            height: 24px;
            background: #222;
            border: 2px solid #fff;
            border-radius: 12px;
            overflow: hidden;
            z-index: 500;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        #healthFill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #f00, #ff0);
            transition: width 0.3s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }

        #fullscreenButton {
            position: absolute;
            top: 20px;
            left: 250px;
            padding: 8px 16px;
            background: var(--bg-ui);
            color: #fff;
            border: 1px solid #fff;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            z-index: 500;
            cursor: pointer;
        }

        #miniMap {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 120px;
            height: 120px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #fff;
            border-radius: 8px;
            z-index: 500;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        #playerList {
            position: absolute;
            top: 150px;
            /* Below MiniMap */
            right: 20px;
            min-width: 150px;
            background: var(--bg-ui);
            border-radius: 8px;
            color: #fff;
            padding: 10px;
            font-size: 14px;
            z-index: 500;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .playerListHeader {
            font-weight: bold;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 5px;
            margin-bottom: 5px;
        }

        .localPlayer {
            color: var(--primary);
        }

        /* Overlays */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--bg-overlay);
            backdrop-filter: blur(8px);
            color: #fff;
            z-index: 2000;
            text-align: center;
        }

        .btn-large {
            margin-top: 30px;
            padding: 15px 40px;
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-large:active {
            background: #fff;
            color: #000;
        }

        /* Animations */
        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .loader {
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }

        /* Notifications */
        #notificationContainer {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1500;
        }

        .notification {
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            animation: fadeInOut 3s forwards;
            border-left: 4px solid var(--accent);
        }

        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: translateY(-20px);
            }

            15% {
                opacity: 1;
                transform: translateY(0);
            }

            85% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: translateY(-10px);
            }
        }

        /* Power-Up Legend Styles */
        .power-up-legend {
            position: absolute;
            top: 50px;
            /* Below health bar */
            left: 20px;
            background: var(--bg-ui);
            padding: 8px 12px;
            border-radius: 8px;
            color: #fff;
            font-size: 11px;
            z-index: 500;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            pointer-events: none;
        }

        .legend-title {
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 12px;
            color: var(--accent);
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 2px;
        }

        .color-box {
            width: 8px;
            height: 8px;
            margin-right: 6px;
            border-radius: 2px;
        }

        /* Responsive Landscape Adjustments */
        @media (orientation: landscape) and (max-height: 500px) {
            .joystick-container {
                bottom: 15px;
                width: 80px;
                height: 80px;
            }

            .joystick-knob {
                width: 40px;
                height: 40px;
                top: 20px;
                left: 20px;
            }

            #joystick {
                left: 20px;
            }

            #turnJoystick {
                right: 110px;
                bottom: 15px;
            }

            #shootButton {
                bottom: 15px;
                right: 20px;
                width: 60px;
                height: 60px;
                font-size: 14px;
            }

            #weaponChangeButton {
                bottom: 85px;
                right: 25px;
                width: 40px;
                height: 40px;
                font-size: 18px;
            }

            #miniMap {
                width: 90px;
                height: 90px;
                top: 10px;
                right: 10px;
            }

            #healthBar {
                width: 150px;
                top: 10px;
                left: 10px;
                height: 18px;
            }

            #fullscreenButton {
                left: 170px;
                top: 10px;
                padding: 4px 10px;
                font-size: 10px;
            }

            #playerList {
                top: 110px;
                right: 10px;
                padding: 5px;
                font-size: 12px;
                min-width: 120px;
            }

            .power-up-legend {
                top: 35px;
                left: 10px;
                font-size: 10px;
            }
        }

        /* Narrow Screen Adjustments (Portrait or small width) */
        @media (max-width: 400px) {
            .joystick-container {
                width: 65px;
                height: 65px;
                bottom: 15px;
            }

            .joystick-knob {
                width: 30px;
                height: 30px;
                top: 17px;
                left: 17px;
            }

            #joystick {
                left: 10px;
            }

            #turnJoystick {
                right: 85px;
                bottom: 15px;
            }

            #shootButton {
                width: 55px;
                height: 55px;
                bottom: 20px;
                right: 10px;
                font-size: 12px;
            }

            #weaponChangeButton {
                width: 35px;
                height: 35px;
                bottom: 85px;
                right: 10px;
                font-size: 16px;
            }

            #healthBar {
                width: 130px;
                left: 10px;
                top: 10px;
                height: 18px;
            }

            #miniMap {
                width: 75px;
                height: 75px;
                top: 10px;
                right: 10px;
            }

            #fullscreenButton {
                left: 150px;
                top: 10px;
                padding: 4px 8px;
                font-size: 9px;
            }

            .power-up-legend {
                display: none;
                /* Hide legend on very small screens to save space */
            }

            #playerList {
                font-size: 10px;
                min-width: 90px;
                padding: 4px;
                top: 100px;
            }
        }
    </style>
</head>

<body>
    <div id="gameContainer">
        <!-- Main Game UI -->
        <canvas id="gameCanvas"></canvas>

        <!-- HUD -->
        <div id="healthBar">
            <div id="healthFill"></div>
        </div>
        <div id="miniMap"></div>
        <button id="fullscreenButton">&#x26F6; FULLSCREEN</button>

        <div id="playerList">
            <div class="playerListHeader">Players Online</div>
            <div id="playerListItems"></div>
        </div>

        <!-- Mobile Controls -->
        <div id="joystick" class="joystick-container">
            <div id="joystickKnob" class="joystick-knob"></div>
        </div>
        <div id="turnJoystick" class="joystick-container">
            <div id="turnJoystickKnob" class="joystick-knob"></div>
        </div>
        <div id="shootButton">FIRE</div>
        <div id="weaponChangeButton">&#x21bb;</div>

        <!-- Notification Container -->
        <div id="notificationContainer"></div>

        <!-- Overlays -->
        <div id="waitingOverlay" class="overlay" style="z-index: 2000;">
            <h1 style="font-size: 2.5em; text-shadow: 0 0 15px rgba(0,255,0,0.6); margin-bottom: 20px;">Waiting for
                Players</h1>
            <p style="color: #ccc; font-size: 1.2em; margin-bottom: 30px;">The game will start as soon as someone joins.
            </p>
            <div class="loader"></div>
        </div>

        <div id="gameOverScreen" class="overlay" style="z-index: 3000;">
            <h2 style="font-size: 3em; margin-bottom: 10px;">GAME OVER</h2>
            <div id="gameOverStatus" style="font-size: 16px; margin-top: 10px; color: #aaa;"></div>
            <div id="restartButton" class="btn-large">Restart</div>
        </div>

        <div id="victoryScreen" class="overlay" style="z-index: 3001;">
            <h2 style="font-size: 3em; text-shadow: 0 0 20px rgba(0,255,0,0.8); margin-bottom: 10px;">VICTORY</h2>
            <p style="font-size: 1.2em; margin-bottom: 20px;">You have defeated the opponent!</p>
            <div id="victoryStatus" style="font-size: 16px; margin-bottom: 10px; color: #aaa;"></div>
            <div id="victoryRestartButton" class="btn-large"
                style="border-color: var(--primary); color: var(--primary);">Restart</div>
        </div>

        <!-- Loading Screen -->
        <div id="loadingScreen" class="overlay" style="display: flex; background: #000; z-index: 5000;">
            <h1 style="margin-bottom: 20px;">Loading Game...</h1>
            <div
                style="width: 300px; height: 10px; background: #222; border-radius: 5px; overflow: hidden; border: 1px solid #444;">
                <div id="loadingBar"
                    style="width: 0%; height: 100%; background: var(--primary); transition: width 0.3s ease-out;"></div>
            </div>
            <div id="loadingText" style="margin-top: 15px; font-size: 14px; color: #888;">Initializing...</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>

    <!-- Game Scripts -->
    <script src="photon.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/maze.js"></script>
    <script src="js/player_model.js"></script> <!-- Added player model script -->
    <script src="js/player.js"></script>
    <script src="js/enemy_types.js"></script> <!-- Added enemy_types script -->
    <script src="js/enemy.js"></script>
    <script src="js/bullet.js"></script>
    <script src="js/powerups.js"></script> <!-- Added powerups script -->
    <script src="js/audio.js"></script> <!-- Added audio system -->
    <script src="js/hazards.js"></script> <!-- Added hazards system -->
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
    <script src="js/multiplayer.js"></script>

</body>

</html>
